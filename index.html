<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXT PLAY｜越谷ボーイズ メンタルトレーニング</title>
<link rel="icon" href="https://spc-jp.github.io/koshigaya-mental-method/favicon.png">
<style>
:root{
  --red:#9D080B; --red-dark:#760507; --navy:#102F50; --navy2:#071B2E;
  --bg:#F5F3F1; --card:#FFFFFF; --text:#172033; --muted:#687385;
  --line:#E8E3E0; --soft-red:#F8EDEE; --soft-navy:#EEF3F7; --green:#237A4B;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--text);padding-bottom:76px;
}
header{
  background:linear-gradient(145deg,var(--red) 0%,var(--red-dark) 62%,#520305 100%);
  color:#fff;padding:13px 14px 17px;position:relative;overflow:hidden;
}
header:after{content:"";position:absolute;width:190px;height:190px;border:32px solid rgba(255,255,255,.06);border-radius:50%;right:-95px;top:-92px}
.wrap{width:min(100%,980px);margin:auto}
.header-inner{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.header-logo{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:13px;padding:3px;box-shadow:0 5px 15px rgba(0,0,0,.18);flex:0 0 auto}
.brand{font-weight:950;font-size:21px;letter-spacing:.02em;line-height:1.15}
.sub{opacity:.92;margin-top:5px;font-size:11px;line-height:1.45}
main{padding:14px 12px 30px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 18px rgba(30,38,48,.055)}
h2,h3{margin-top:0}
h2{font-size:21px;line-height:1.4}
h3{font-size:17px}
.small{font-size:12.5px;color:var(--muted);line-height:1.65}
.side{display:contents}
.side .card:first-child{order:2}
.side .card:nth-child(2){order:5}
section{display:contents}
section>.card:nth-child(1){order:1}
section>.card:nth-child(2){order:3}
section>.card:nth-child(3){order:4}
section>.card:nth-child(4){order:6}
.section-title{display:flex;align-items:center;gap:9px}
.icon-red{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--red);flex:0 0 auto}
.icon-red svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.step-icon{width:19px;height:19px;margin-right:7px;color:var(--red);flex:0 0 auto}
.step-icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{
  min-height:48px;padding:10px 9px;border-radius:13px;background:#F7F7F8;font-weight:800;
  font-size:12.5px;display:flex;align-items:center;border:1px solid #ECEDEF;cursor:pointer
}
.step:last-child{grid-column:1/-1}
.step.active{background:var(--soft-red);color:var(--red);border-color:#DCAEB0;outline:none}
.progress{height:9px;background:#EEE9E7;border-radius:99px;overflow:hidden;margin-top:10px}
.bar{height:100%;background:linear-gradient(90deg,var(--red),#C3292D);width:0;transition:width .3s}
.badge{display:inline-block;font-size:11px;font-weight:900;color:var(--red);background:var(--soft-red);border-radius:99px;padding:6px 10px;margin-bottom:11px}
.q:before{content:"君ならどうする？";display:block;color:var(--red);font-size:12px;letter-spacing:.08em;margin-bottom:7px;font-weight:950}
.q{font-size:19px;font-weight:950;line-height:1.55;margin:4px 0 14px}
.choice{
  width:100%;text-align:left;border:1px solid #DDDDE2;background:#fff;border-radius:14px;
  padding:14px 13px;margin:6px 0;font-size:14.5px;line-height:1.5;cursor:pointer;
  min-height:54px;box-shadow:0 2px 6px rgba(20,25,35,.025)
}
.choice:active{transform:scale(.99)}
.choice.correct{border:2px solid #64A47D;background:#EFF8F2}
.choice.wrong{border:2px solid #C85B5E;background:#FFF0F0}
.feedback{display:none;margin-top:15px;padding:15px;border-radius:15px;background:var(--soft-navy);border:1px solid #DCE6EE;line-height:1.7;font-size:14px}
.feedback.show{display:block}
.feedback>b{font-size:16px;color:var(--navy)}
.feedback strong{display:block;margin:13px 0 3px;padding-top:9px;border-top:1px solid #D6E0E8;color:var(--navy)}
.feedback strong:nth-of-type(2){color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.btn{border:0;border-radius:13px;padding:13px 10px;font-weight:900;cursor:pointer;min-height:46px}
.primary{background:var(--red);color:#fff;grid-column:1/-1;grid-row:1}
.secondary{background:#ECEFF2;color:#243247}
.promise{border-left:4px solid var(--red);padding:9px 0 9px 12px;margin:5px 0;line-height:1.5;font-size:13.5px;font-weight:700}
.quote{font-size:16px;font-weight:950;line-height:1.7;color:var(--navy)}
footer{text-align:center;color:#7B8493;font-size:11px;padding:12px}
.mobile-nav{
  position:fixed;z-index:30;left:0;right:0;bottom:0;height:64px;background:rgba(255,255,255,.96);
  border-top:1px solid #DDD;display:grid;grid-template-columns:repeat(4,1fr);
  box-shadow:0 -5px 18px rgba(20,25,35,.08);backdrop-filter:blur(10px)
}
.mobile-nav button{border:0;background:transparent;color:#667085;font-size:10px;font-weight:800;padding:7px 2px}
.mobile-nav span{display:block;font-size:20px;line-height:1.1;margin-bottom:3px}
.mobile-nav button.active{color:var(--red)}
.today-label{font-size:11px;font-weight:950;letter-spacing:.08em;color:var(--red);margin-bottom:4px}
@media(min-width:761px){
 body{padding-bottom:0}.mobile-nav{display:none}header{padding:20px 16px}
 .header-logo{width:70px;height:70px}.brand{font-size:27px}.sub{font-size:13px}
 main{padding:20px 14px 40px}.grid{display:grid;grid-template-columns:240px 1fr;gap:16px}
 .side{display:block}.side .card{margin-bottom:14px}section{display:block}
 .steps{display:block}.step{margin:8px 0}.step:last-child{grid-column:auto}
 .q{font-size:21px}.actions{display:flex}.primary{grid-column:auto;grid-row:auto;margin-left:auto}
}
</style>
</head>
<body>
<header><div class="wrap header-inner">
<img class="header-logo" src="https://spc-jp.github.io/koshigaya-mental-method/favicon.png" alt="越谷ボーイズ ロゴ">
<div>
<div class="brand">NEXT PLAY｜次の一球へ</div>
<div class="sub">越谷ボーイズ｜中学生・硬式野球のための「自分で考えて戦う」メンタルトレーニング</div>
</div>
</div></header>

<main class="wrap">
<div class="grid">
<aside class="side">
<div class="card">
<h3 class="section-title"><span class="icon-red">
<svg viewBox="0 0 24 24"><path d="M4 18l5-5 4 3 7-9"/><path d="M15 7h5v5"/></svg>
</span>成長ストーリー</h3>
<div class="steps" id="steps"></div>
</div>
<div class="card" style="margin-top:14px">
<h3 class="section-title"><span class="icon-red">
<svg viewBox="0 0 24 24"><path d="M13 2s1 4-2 7c-2 2-3 4-2 7 1 3 4 5 7 4 4-1 6-5 4-9-1-2-3-4-5-5 0 3-1 4-2 5 1-4-2-6-2-9z"/></svg>
</span>今日のルーティン</h3>
<div id="routineTheme" style="font-weight:900;color:var(--red);margin:2px 0 8px"></div>
<div class="small" id="dailyRoutine"></div>
<div style="margin-top:13px;padding:12px 13px;background:var(--soft-red);border-radius:13px;border-left:4px solid var(--red)">
  <div style="font-size:11px;font-weight:900;color:var(--red);letter-spacing:.06em">今日のひと言</div>
  <div id="dailyWord" style="font-size:14px;font-weight:900;line-height:1.65;margin-top:4px"></div>
</div>
</div>
</aside>

<section>
<div class="card">
<div style="display:flex;justify-content:space-between;gap:12px;align-items:end">
<div><div class="today-label">TODAY’S MENTAL</div><h2 style="margin:3px 0">昨日の自分より、一歩前へ。</h2><div class="small">正解を競うのではなく、「次にどう動くか」を身につけよう。</div></div>
<div class="small"><span id="done">0</span> / <span id="total">15</span> 問</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div class="card" style="margin-top:14px">
<div class="badge" id="category"></div>
<div class="q" id="question"></div>
<div id="choices"></div>
<div class="feedback" id="feedback"></div>
<div class="actions">
<button class="btn secondary" id="prev">← 前へ</button>
<button class="btn secondary" id="random">ランダム</button>
<button class="btn primary" id="next">次の一球へ →</button>
</div>
</div>

<div class="card" style="margin-top:14px">
<h3 class="section-title"><span class="icon-red">
<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9-9c-1.5-3.4.7-7 4.4-7 2 0 3.5 1 4.6 2.4C13.1 6 14.6 5 16.6 5c3.7 0 5.9 3.6 4.4 7-2 4.6-9 9-9 9z"/></svg>
</span>このアプリの約束</h3>
<div class="promise">ミスした選手を責めない</div>
<div class="promise">失敗を隠さない</div>
<div class="promise">自分で考えて、次の行動を決める</div>
<div class="promise">仲間の成功を自分のことのように喜ぶ</div>
</div>

<div class="card" style="margin-top:14px">
<div class="quote">「監督を日本一にしたい」を、言われたから動く力ではなく、<br>自分で考え、仲間のために動く力へ。</div>
</div>
</section>
</div>
</main>

<nav class="mobile-nav" aria-label="スマホメニュー">
<button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>ホーム</button>
<button onclick="document.getElementById('question').scrollIntoView({behavior:'smooth',block:'center'})"><span>⚾</span>今日の1問</button>
<button onclick="document.getElementById('steps').scrollIntoView({behavior:'smooth',block:'center'})"><span>↗</span>成長</button>
<button onclick="document.querySelector('.promise').scrollIntoView({behavior:'smooth',block:'center'})"><span>★</span>約束</button>
</nav>
<footer>越谷ボーイズ メンタルトレーニング｜Prototype</footer>

<script>
const data=[
{c:"自分を整える",q:"自分のエラーで相手に点が入った。次の守備につく前、どうする？",a:["下を向いて引きずる","誰かのせいにする","長く息を吐き、次の一球でできることを決める","ミスを忘れようと無理に考えない"],ok:2,think:"失敗した事実は消せません。でも、次の一球の準備は今からできます。",next:"息を吐く → グローブを見る → 『次！』と声を出す。",team:"近くの仲間にも『次いこう』と声をかける。"},
{c:"自分を整える",q:"2打席連続で三振。3打席目に入る前に大切なのは？",a:["絶対ヒットを打つと力む","前の三振を何度も思い出す","自分でコントロールできることを1つ決める","監督の顔色を見る"],ok:2,think:"結果ではなく、今できる準備に意識を戻します。",next:"『ボールを最後まで見る』など1つだけ決める。",team:"打席を終えたら、次の打者に相手投手の情報を伝える。"},
{c:"自分を整える",q:"大事な試合前。緊張して心臓がドキドキしている。どう考える？",a:["緊張する自分は弱い","緊張をゼロにしないとダメ","体が試合の準備をしているサインと考える","試合から逃げたいと考える"],ok:2,think:"緊張は悪者ではありません。大切な場面に向かう体の反応です。",next:"呼吸を整え、最初のプレーだけに集中する。",team:"仲間に明るく声をかけ、チームの空気を整える。"},
{c:"仲間を支える",q:"仲間が2回続けてエラーした。あなたなら？",a:["『何やってるんだ』と言う","無視する","『次いこう。俺がカバーする』と声をかける","監督に交代を求める"],ok:2,think:"仲間が苦しい時の一言が、チームの次のプレーを変えます。",next:"短く前向きな声をかける。",team:"責める空気を作らず、全員を次の一球へ戻す。"},
{c:"仲間を支える",q:"今日はベンチスタート。自分にできることは？",a:["出番まで何もしない","不満そうにする","相手の特徴を観察し、声と情報でチームに貢献する","スマホのことを考える"],ok:2,think:"試合に出ている11人や9人だけがチームではありません。",next:"相手投手・走者・守備位置などを観察する。",team:"必要な情報を短く仲間へ伝える。"},
{c:"仲間を支える",q:"後輩が同じミスを繰り返している。どうする？",a:["怒鳴る","自分には関係ない","何が難しいか聞き、一つだけ改善点を一緒に考える","全部教えて従わせる"],ok:2,think:"教えることもチームを強くする力です。",next:"まず相手の話を聞く。",team:"『一緒にやろう』の姿勢を作る。"},
{c:"チームを強くする",q:"0対4で負けていて、ベンチが静かになった。最初に何をする？",a:["誰かが声を出すのを待つ","負けを受け入れる","自分から具体的な声を出す","監督に任せる"],ok:2,think:"チームの空気は、誰か一人の行動から変わります。",next:"『先頭出よう！』『一つずつ返そう！』と具体的に声を出す。",team:"周囲を巻き込み、次の1点に集中させる。"},
{c:"チームを強くする",q:"仲間が見逃し三振。ベンチに戻ってきた時は？",a:["責める","何も言わない","迎えて、次の役割へ気持ちを切り替えさせる","笑う"],ok:2,think:"終わったプレーより、次にチームへ何ができるかが大切です。",next:"『次あるぞ』と短く迎える。",team:"失敗しても戻ってこられるベンチを作る。"},
{c:"チームを強くする",q:"練習で自分のプレーだけ良ければいい？",a:["もちろん自分だけでいい","レギュラーだけ良ければいい","自分の成長と同時にチームが良くなる行動も考える","監督が考えること"],ok:2,think:"強いチームは、自分の成長をチームの成長につなげます。",next:"自分の課題を一つ改善する。",team:"仲間への声、準備、片付けまでチームの一員として動く。"},
{c:"自分で考える",q:"監督から細かい指示が出ない場面。どうする？",a:["何もしない","指示がないことに不満を言う","状況を見て、自分の役割と最善の行動を考える","好き勝手に動く"],ok:2,think:"自分で考えるとは、勝手にやることではなく、目的と状況から判断することです。",next:"アウトカウント・点差・走者・自分の役割を確認する。",team:"必要なら仲間と短く確認してから動く。"},
{c:"自分で考える",q:"監督に『もっと考えてプレーしろ』と言われた。まず何を考える？",a:["怒られたことだけ考える","答えを全部聞く","次は何を見て判断すればいいか考える","自分には無理と思う"],ok:2,think:"答えを覚えるだけでなく、判断するための『見るポイント』を持ちます。",next:"『次は何を見れば判断できる？』と自分に問いかける。",team:"分からなければ仲間や指導者に質問する。"},
{c:"自分で考える",q:"試合に負けた。反省で一番大切なのは？",a:["誰が悪かったか決める","全部ダメだったと考える","自分たちで変えられることを一つ決める","すぐ忘れる"],ok:2,think:"反省は落ち込む時間ではなく、次を良くする材料を見つける時間です。",next:"改善する行動を一つ言葉にする。",team:"チームでも『次に変える一つ』を共有する。"},
{c:"日本一を目指す",q:"『監督を日本一にしたい』。その気持ちを行動にすると？",a:["監督の言うことを全部そのままやる","勝てない時は監督のせいにする","教えの意味を理解し、自分で考えてチームのために動く","気持ちだけ持っていればいい"],ok:2,think:"感謝は服従ではありません。教わったことを自分の力に変え、チームへ返すことです。",next:"今日、自分からできる一つを決める。",team:"仲間にも考えるきっかけを作る。"},
{c:"日本一を目指す",q:"日本一を目指しているのに結果が出ない時は？",a:["目標を諦める","急に特別なことを始める","大きな目標を今日できる小さな行動に分ける","誰かのせいにする"],ok:2,think:"大きな目標は、毎日の小さな行動の積み重ねで近づきます。",next:"今日の練習で徹底することを一つ決める。",team:"チーム全員が続けられる小さな基準を大切にする。"},
{c:"日本一を目指す",q:"日本一のチームに必要な『強い心』とは？",a:["絶対にミスしないこと","いつも自信満々でいること","失敗しても次の行動を選び続けること","弱音を一切吐かないこと"],ok:2,think:"本当の強さは、失敗しないことではなく、失敗のあとにどう動くかです。",next:"感情を認めて、次の一球へ戻る。",team:"仲間が戻れる声と空気を作る。"}
];

const cats=["自分を整える","仲間を支える","チームを強くする","自分で考える","日本一を目指す"];
const catIcons={
"自分を整える":'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
"仲間を支える":'<svg viewBox="0 0 24 24"><path d="M8 12l3 3 5-6"/><path d="M4 19c1-3 3-5 6-5"/><path d="M20 19c-1-3-3-5-6-5"/></svg>',
"チームを強くする":'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-4 2-6 6-6s6 2 6 6"/><path d="M12 15c1-1 2-1 4-1 4 0 6 2 6 6"/></svg>',
"自分で考える":'<svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8 14c-2-1-3-3-3-5a7 7 0 0 1 14 0c0 2-1 4-3 5-1 1-1 2-1 3H9c0-1 0-2-1-3z"/></svg>',
"日本一を目指す":'<svg viewBox="0 0 24 24"><path d="M8 4h8v5c0 4-2 6-4 6s-4-2-4-6V4z"/><path d="M8 6H4c0 4 2 6 5 6"/><path d="M16 6h4c0 4-2 6-5 6"/><path d="M12 15v4"/><path d="M8 21h8"/></svg>'
};
let filtered=[...data], idx=0, selectedCat=null;
let solved=new Set(JSON.parse(localStorage.getItem("nextplaySolved")||"[]"));

function renderSteps(){
 const el=document.getElementById("steps"); el.innerHTML="";
 cats.forEach(c=>{const d=document.createElement("div");d.className="step"+(selectedCat===c?" active":"");d.innerHTML=`<span class="step-icon">${catIcons[c]}</span><span>${c}</span>`;d.onclick=()=>{selectedCat=(selectedCat===c?null:c);filtered=selectedCat?data.filter(x=>x.c===selectedCat):[...data];idx=0;renderSteps();render()};el.appendChild(d)})
}
function render(){
 const x=filtered[idx]; document.getElementById("category").textContent=x.c;
 document.getElementById("question").textContent=x.q;
 const choices=document.getElementById("choices");choices.innerHTML="";
 x.a.forEach((t,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=(i+1)+". "+t;b.onclick=()=>answer(i,b,x);choices.appendChild(b)});
 document.getElementById("feedback").className="feedback"; updateProgress();
}
function answer(i,b,x){
 document.querySelectorAll(".choice").forEach((el,j)=>{el.disabled=true;if(j===x.ok)el.classList.add("correct")});
 if(i!==x.ok)b.classList.add("wrong");
 const id=data.indexOf(x);solved.add(id);localStorage.setItem("nextplaySolved",JSON.stringify([...solved]));
 const f=document.getElementById("feedback");f.innerHTML=(i===x.ok?"<b>✓ いい判断です</b>":"<b>ここからがトレーニング</b>")+
 "<strong>考え方</strong>"+x.think+"<strong>次の行動</strong>"+x.next+"<strong>チームへの行動</strong>"+x.team;f.className="feedback show";updateProgress();
}
function updateProgress(){document.getElementById("done").textContent=solved.size;document.getElementById("total").textContent=data.length;document.getElementById("bar").style.width=(solved.size/data.length*100)+"%"}
document.getElementById("next").onclick=()=>{idx=(idx+1)%filtered.length;render()};
document.getElementById("prev").onclick=()=>{idx=(idx-1+filtered.length)%filtered.length;render()};
document.getElementById("random").onclick=()=>{idx=Math.floor(Math.random()*filtered.length);render()};
renderSteps();render();

const dailyMental = [
 {theme:"1週間を振り返る", routine:["今週できたことを1つ思い出す","仲間に感謝した場面を思い出す","来週の一歩を1つ決める"], word:"成長は、昨日の自分と比べればいい。"},
 {theme:"切り替える力", routine:["息を長く吐く","昨日の失敗を手放す","今日の最初の一球に集中する"], word:"終わった一球より、これからの一球。"},
 {theme:"集中する力", routine:["周りを一度見る","今やることを1つ決める","そのプレーだけに集中する"], word:"全部を考えない。今、この一球。"},
 {theme:"仲間への声かけ", routine:["仲間の表情を見る","自分から前向きな声を出す","仲間の良いプレーを言葉にする"], word:"自分の声で、チームの空気は変えられる。"},
 {theme:"失敗から立て直す", routine:["ミスを認める","次に変えられることを1つ決める","顔を上げて次の準備をする"], word:"ミスは終わりじゃない。次の一球が始まり。"},
 {theme:"自分で考える", routine:["状況を確認する","自分の役割を考える","自分から一歩動く"], word:"指示を待つ前に、自分にできることを考えよう。"},
 {theme:"試合に向かう心", routine:["深呼吸を3回する","今日の自分の役割を決める","最初の一球に集中する"], word:"日本一への道も、目の前の一球から。"}
];
function renderDailyMental(){
 const d = dailyMental[new Date().getDay()];
 document.getElementById("routineTheme").textContent = d.theme;
 document.getElementById("dailyRoutine").innerHTML = d.routine.map((x,i)=>`${["①","②","③"][i]} ${x}`).join("<br>");
 document.getElementById("dailyWord").textContent = d.word;
}
renderDailyMental();

</script>
